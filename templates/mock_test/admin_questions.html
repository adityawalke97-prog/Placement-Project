{% extends 'mock_tests/base.html' %}{% block mock_title %}Question Bank Admin{% endblock %}{% block mock_content %}
<div class="mt-pagehead"><span class="mt-kicker">ADMIN TOOLS</span><h1>Add question bank item</h1><p>Questions added here become available in standard and custom mock tests.</p></div><form method="post" class="mt-form"><label>Subject</label><select name="subject_id" required><option value="">Choose subject</option>{% for s in subjects %}<option value="{{ s.id }}">{{ s.course_name }} — {{ s.subject_name }}</option>{% endfor %}</select><label>Question</label><textarea name="question_text" rows="3" required></textarea><div class="mt-form-grid">{% for x in ['a','b','c','d'] %}<div><label>Option {{ x|upper }}</label><input name="option_{{ x }}" required></div>{% endfor %}</div><div class="mt-form-grid"><div><label>Correct option</label><select name="correct_option"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div><label>Difficulty</label><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div><label>Explanation (optional)</label><textarea name="explanation" rows="2"></textarea><button class="mt-btn">Save question</button></form>
{% endblock %}
