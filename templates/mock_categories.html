{% extends "layout.html" %}

{% block content %}

<h2>Mock Test Categories</h2>

{% for c in categories %}
<div class="card">
    <h3>{{ c.category }}</h3>
    <p>Total Questions: {{ c.total_questions }}</p>

    <a href="{{ url_for('mock_test', category=c.category) }}">
        Start Test
    </a>
</div>
{% endfor %}

{% endblock %}
