{% extends "layout.html" %}

{% block title %}Courses{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1 class="text-center mb-5">
        📚 Our Courses
    </h1>

    <div class="row">

        {% if courses %}

            {% for course in courses %}

            <div class="col-lg-4 col-md-6 mb-4">

                <div class="card shadow h-100 border-0 rounded-4">

                    <div class="card-body">

                        <h3 class="card-title">
                            {{ course.course_title }}
                        </h3>

                        <p class="text-muted">
                            {{ course.description }}
                        </p>

                    </div>

                    <div class="card-footer bg-white border-0">

                        <a href="{{ url_for('course', course_name=course.course_name) }}"
                           class="btn btn-primary w-100">

                            🚀 Start Course

                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        {% else %}

            <div class="col-12">

                <div class="alert alert-warning text-center">

                    No Courses Available.

                </div>

            </div>

        {% endif %}

    </div>

</div>

<style>

.card{
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card-title{
    font-size:24px;
    font-weight:700;
}

.btn-primary{
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:bold;
}

</style>

{% endblock %}
