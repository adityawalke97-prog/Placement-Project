
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Training Portal{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#007bff;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:25px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        p{
            text-align:center;
            margin-top:20px;
        }

        a{
            color:#007bff;
            text-decoration:none;
        }

        .flash{
            color:red;
            text-align:center;
            margin-bottom:15px;
        }
        .divider{
    display:flex;
    align-items:center;
    margin:25px 0;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#ddd;
}

.divider span{
    margin:0 15px;
    color:#666;
    font-weight:600;
    font-size:14px;
}

.google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    padding:13px;

    background:#fff;
    border:1px solid #dadce0;
    border-radius:8px;

    text-decoration:none;
    color:#444;
    font-weight:600;
    font-size:15px;

    transition:.3s;
}

.google-btn img{
    width:22px;
    height:22px;
}

.google-btn:hover{
    background:#f8f9fa;
    border-color:#4285F4;
    color:#4285F4;
    transform:translateY(-2px);
    box-shadow:0 6px 15px rgba(0,0,0,.08);
}
    </style>
</head>
<body>

<div class="container">

    <h1>Login</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login" method="POST">

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>

</form>

<div class="divider">
    <span>OR</span>
</div>

<a href="{{ url_for('google_login') }}" class="google-btn">
    <img src="https://developers.google.com/identity/images/g-logo.png"
         alt="Google">
    Continue with Google
</a>

<p>
    Don't have an account?
    <a href="/signup">Create Account</a>
</p>

</div>

</body>
</html>
